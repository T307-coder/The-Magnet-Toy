name: Build

on:
  push:
    branches: [the-electric-magnet-toy]
  workflow_dispatch:

jobs:
  windows-static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install meson & ninja
        run: pip install meson ninja

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (static release)
        run: meson setup build-static -Dstatic=prebuilt --buildtype=release

      - name: Build
        run: ninja -C build-static

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: powder-static-x64
          path: build-static/powder.exe
